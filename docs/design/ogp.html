<!DOCTYPE html>
<!-- ogp.png（1200×630）の原本。生成: docs/design-guidelines.md §8 の手順（ヘッドレス Chrome で撮影）。公開ビルドからは docs/ ごと除外される。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配色さん OGP</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f8f6f2; color: #0f0f0f; font-family: "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; letter-spacing: -0.5px; }
.card { position: absolute; inset: 48px; background: #fff; border: 2px solid #e0e0e0; border-radius: 32px; overflow: hidden; }
.bar { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: #f28c06; }
.text { position: absolute; left: 72px; top: 60px; }
.brand { margin: 0; font-size: 30px; font-weight: 700; color: #6b6b6b; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 32px; margin-top: 36px; }
.icon { width: 120px; height: 120px; border-radius: 30px; background: #fff8f0; color: #f28c06; display: flex; align-items: center; justify-content: center; flex: none; }
.icon svg { width: 70px; height: 70px; }
.name { margin: 0; font-size: 84px; font-weight: 700; line-height: 1.15; }
.tag { margin: 22px 0 0; font-size: 36px; line-height: 1.45; color: #444; }
.chips { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 14px; }
.chip { font-size: 24px; font-weight: 700; color: #9a5200; background: #fff8f0; border: 2px solid #ffd9a8; border-radius: 999px; padding: 6px 22px; }
.fan { position: absolute; right: 56px; top: 64px; width: 330px; height: 400px; }
.pc { position: absolute; width: 290px; padding: 12px; background: #fff; border: 2px solid #e0e0e0; border-radius: 18px; box-shadow: 0 10px 24px rgba(15,15,15,.10); }
.sw { display: flex; height: 132px; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(15,15,15,.08); }
.sw span:nth-child(1) { flex: 4; } .sw span:nth-child(2) { flex: 3; } .sw span:nth-child(3) { flex: 2; } .sw span:nth-child(4) { flex: 1; } .sw span:nth-child(5) { flex: .7; }
.ln { display: flex; gap: 6px; margin-top: 10px; } .ln i { height: 8px; border-radius: 4px; background: #d9d5cc; width: 120px; } .ln i + i { background: #e7e3db; width: 40px; }
</style>
</head>
<body>
<div class="card"><div class="bar"></div>
  <div class="text">
    <p class="brand">edi-tool</p>
    <div class="row"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg></div>
      <p class="name">配色さん</p></div>
    <p class="tag">印象語から配色を見比べて、<br>AIに渡す指示文までコピー</p>
  </div>
  <div class="chips"><span class="chip">24案を比較</span><span class="chip">AI向け指示文</span><span class="chip">ブラウザ完結</span></div>
  <div class="fan" aria-hidden="true">
    <div class="pc" style="left:10px;top:0;transform:rotate(-8deg)"><div class="sw"><span style="background:#13213A"></span><span style="background:#3C5A88"></span><span style="background:#F2C14E"></span><span style="background:#F4F1EA"></span><span style="background:#EF6F6C"></span></div><div class="ln"><i></i><i></i></div></div>
    <div class="pc" style="left:40px;top:82px;transform:rotate(4deg)"><div class="sw"><span style="background:#FFF6EC"></span><span style="background:#D9572B"></span><span style="background:#F6C177"></span><span style="background:#2B1A12"></span><span style="background:#2A7F9E"></span></div><div class="ln"><i></i><i></i></div></div>
    <div class="pc" style="left:0;top:168px;transform:rotate(-3deg)"><div class="sw"><span style="background:#EEF2F0"></span><span style="background:#4F6D6A"></span><span style="background:#A7BFB8"></span><span style="background:#1F2A28"></span><span style="background:#C98B5B"></span></div><div class="ln"><i></i><i></i></div></div>
    <div class="pc" style="left:30px;top:250px;transform:rotate(6deg)"><div class="sw"><span style="background:#F4F7FB"></span><span style="background:#2B4C7E"></span><span style="background:#8FB3D9"></span><span style="background:#1B2433"></span><span style="background:#F2A541"></span></div><div class="ln"><i></i><i></i></div></div>
  </div>
</div>
</body>
</html>
